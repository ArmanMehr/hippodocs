services:
  db:
    image: paradedb/paradedb:0.26.6-pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vector_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_search"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d vector_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
