[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hippodocs"
version = "0.0.1"
description = "Self-hosted RAG platform - ingest documents, ask questions, get cited answers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.1,<0.140.0",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "liteparse>=2.8.0",
    "numpy>=2.5.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff.lint]
ignore = [
    "EXE002",
]

[tool.pyrefly]
preset = "strict"

